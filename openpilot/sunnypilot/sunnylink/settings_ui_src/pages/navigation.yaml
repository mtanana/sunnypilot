# Page: navigation
# Edit this file. Run compile_settings_ui.py to emit settings_ui.json.
id: navigation
label: Navigation
icon: navigation
order: 8
remote_configurable: true
description: The navigation service that calculates routes on the comma, and its guidance on the driving screen.
  Away from home wifi it needs a data connection (comma prime/eSIM or mobile hotspot) to route. One required
  setting, the Mapbox token, is not here yet, so set it in the sunnynav app (Settings > Map) or on the device-hosted
  page (Settings), at {device_page}.
sections:
- id: service
  title: ''
  description: ''
  items:
  - key: AllowNavigation
    widget: toggle
    title: Allow Navigation
    description: While it is off, no destination can be set.
    enablement:
    - $ref: '#/macros/offroad'
  - key: MapboxRecompute
    widget: toggle
    title: Reroute Automatically
    description: Recompute the route automatically when you leave it. The device needs a data connection (comma
      prime/eSIM or mobile hotspot) for this to work, otherwise the route, and navigation, is lost.
    enablement:
    - $ref: '#/macros/offroad'
  - key: NavDesiresAllowed
    widget: toggle
    title: Use Route Turn Desires
    description: When you signal for a turn on your route, the car plans that turn at the intersection instead of guessing from the road ahead.
    enablement:
    - $ref: '#/macros/offroad'
  - key: NavTurnSlowdown
    widget: toggle
    title: Slow for Route Turns
    description: Slow down ahead of each turn on your route to the speed drivers take a corner of that angle. Applies to turns of 55 degrees or more.
    enablement:
    - $ref: '#/macros/offroad'
    - $ref: '#/macros/longitudinal'
- id: guidance
  title: Guidance
  description: The turn card, lanes and sounds while a route is active
  items:
  - key: NavHudMode
    widget: multiple_button
    title: Guidance on Screen
    description: 'Turns: next-turn card under the set speed. ETA: arrival pill tucked under the nav chip, comma 3X only.'
    options:
    - value: 0
      label: 'Off'
    - value: 1
      label: Turns
    - value: 2
      label: ETA
      enablement:
      - $ref: '#/macros/hide_on_mici'
    - value: 3
      label: Both
      enablement:
      - $ref: '#/macros/hide_on_mici'
    enablement:
    - $ref: '#/macros/offroad'
  - key: NavLaneGuidance
    widget: toggle
    title: Show Lanes
    description: Show which lanes lead to the next maneuver.
    enablement:
    - $ref: '#/macros/offroad'
  - key: NavLaneChangeTimer
    widget: option
    title: Route Lane Change Delay
    description: A separate lane change delay for changes requested by the navigation logic.
    options:
    - value: 0
      label: 'Off'
    - value: 1
      label: Nudgeless
    - value: 2
      label: 0.5 second
    - value: 3
      label: 1 second
    - value: 4
      label: 2 seconds
    - value: 5
      label: 3 seconds
    enablement:
    - $ref: '#/macros/offroad'
  - key: NavigationAudio
    widget: toggle
    title: Turn Sounds
    description: 'A tone pair for each maneuver: rising means right, falling means left, faster and doubled when the turn
      is close.'
    enablement:
    - $ref: '#/macros/offroad'
  - key: NavMiciQuietGlyph
    widget: toggle
    title: Always Show Next Turn
    description: Off, the arrow for the next turn appears as the turn approaches and clears after it. On, a dim arrow for the next turn stays in the corner the whole route.
    visibility:
    - type: capability
      field: device_type
      equals: mici
    enablement:
    - $ref: '#/macros/offroad'
